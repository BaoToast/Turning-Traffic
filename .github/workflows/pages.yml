name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 測試不掛在部署流程上等於沒有測試，壞掉的計算會直接被推上正式網站。
      # rendered-html 那一支要讀 dist/server，所以必須先跑 build 再測。
      - run: pnpm build
      - run: pnpm test
      - run: pnpm build:github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: github-pages-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
